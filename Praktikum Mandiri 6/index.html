<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pengolah Nilai Mahasiswa</title>
</head>
<body>

    <h2>Pengolah Nilai Mahasiswa</h2>

    <script>
        const nama = "Naufal";

        let tugas = 80;
        let uts = 70;
        let uas = 90;

        let nilaiAkhir = (tugas * 0.30) +
                         (uts * 0.30) +
                         (uas * 0.40);

        let status;

        if (nilaiAkhir >= 60) {
            status = "LULUS";
        } else {
            status = "TIDAK LULUS";
        }

        console.log("Nama Mahasiswa:", nama);
        console.log("Nilai Tugas:", tugas);
        console.log("Nilai UTS:", uts);
        console.log("Nilai UAS:", uas);
        console.log("Nilai Akhir:", nilaiAkhir);
        console.log("Status Kelulusan:", status);
    </script>

</body>
</html>
